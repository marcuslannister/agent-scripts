name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The upstream overlay check reads the recorded upstream commit, which
      # main restores paths from but does not contain.
      - name: Fetch recorded upstream commit
        run: git fetch --quiet --depth=1 https://github.com/steipete/agent-scripts "$(jq -r .commit agent-tooling/upstream-overlay.json)"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            skills/video-transcript-downloader/package-lock.json

      - name: Install verification dependencies
        run: |
          sudo apt-get install --yes --quiet ripgrep >/dev/null
          python3 -m pip install --quiet pyyaml
          npm ci
          npm ci --prefix skills/video-transcript-downloader

      - name: Verify
        run: agent-tooling/verify.sh

  gitleaks:
    uses: ./.github/workflows/gitleaks.yml
