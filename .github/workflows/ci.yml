name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the upstream overlay check needs the merged upstream commit

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            skills/video-transcript-downloader/package-lock.json

      - name: Install verification dependencies
        run: |
          python3 -m pip install --quiet pyyaml
          npm ci
          npm ci --prefix skills/video-transcript-downloader

      - name: Verify
        run: agent-tooling/verify.sh

  gitleaks:
    uses: ./.github/workflows/gitleaks.yml
